<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Belajar</title>
<style>
  :root { color-scheme: dark; --bg:#000; --panel:#1b1b1b; --line:#eee; --muted:#9b9b9b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#f7f7f7; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { text-align:center; padding:24px 12px 20px; border-bottom:3px solid var(--line); }
  header h1 { margin:0; font-size:clamp(24px,5vw,36px); line-height:1.25; font-weight:800; }
  main { max-width:760px; margin:0 auto; padding:0 18px 110px; }
  .progress { color:#aaa; text-align:center; font-size:23px; margin:2px 0 34px; }
  .flashcard { min-height:min(55vh,425px); border:0; border-radius:24px; background:transparent; padding:0; text-align:center; cursor:pointer; user-select:none; perspective:1200px; }
  .card-inner { position:relative; width:100%; min-height:min(55vh,425px); transform-style:preserve-3d; transition:transform .6s cubic-bezier(.2,.7,.2,1); }
  .flashcard.flipped .card-inner { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; min-height:min(55vh,425px); border:2px solid var(--line); border-radius:24px; background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow-wrap:anywhere; }
  .card-back { transform:rotateY(180deg); }
  .word { font-size:clamp(38px,8vw,54px); font-weight:800; }
  .meaning { margin-top:16px; font-size:clamp(21px,5vw,28px); color:#cfcfcf; }
  .reading { font-size:clamp(26px,6vw,34px); font-weight:750; color:#f5f5f5; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:28px 0 22px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:14px; padding:18px 22px; color:white; font-weight:750; font-size:clamp(16px,3.8vw,23px); }
  button:focus-visible, .stat:focus-visible, .nav-item:focus-visible { outline:3px solid white; outline-offset:3px; }
  .red { background:#762c2f; } .yellow { background:#70672a; } .green { background:#246d3c; }
  .panel { border:3px solid var(--line); border-radius:24px; background:var(--panel); padding:30px 32px 36px; margin-top:34px; }
  .panel h2 { text-align:center; font-size:clamp(25px,5vw,32px); margin:0 0 30px; }
  .stat { border:1px solid #4a4a4a; border-radius:14px; padding:24px; margin:16px 0; cursor:pointer; }
  .stat .label { font-size:clamp(19px,4vw,27px); display:flex; align-items:center; gap:10px; }
  .stat .count { font-size:38px; font-weight:800; margin-top:4px; }
  .stat.green-bg { background:#1d3023; } .stat.yellow-bg { background:#302e1d; } .stat.red-bg { background:#301e1f; }
  .subtext { text-align:center; color:#888; font-size:21px; margin:34px 0 4px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; background:#111; border-top:3px solid #eee; padding:14px 10px 12px; z-index:5; }
  .nav-item { width:50%; text-align:center; cursor:pointer; color:#bbb; font-weight:750; font-size:18px; padding:8px; }
  .nav-item.active { color:white; }
  .nav-item .emoji { display:block; font-size:32px; margin-bottom:2px; }
  .hidden { display:none !important; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:20px 0; }
  .small-btn { font-size:16px; padding:10px 14px; background:#333; }
  .header-actions { max-width:760px; margin:0 auto; padding:12px 18px 0; display:flex; justify-content:space-between; gap:12px; }
  .header-actions .small-btn { background:#292929; }
  .reading { margin-top:4px; font-size:clamp(26px,6vw,34px); font-weight:750; color:#f5f5f5; }
  .meaning { margin-top:16px; font-size:clamp(21px,5vw,28px); color:#cfcfcf; }
  .extra-toolbar { justify-content:center; margin-top:8px; }
  .extra-toolbar .small-btn { background:#242424; color:#ddd; }
  .empty { color:#aaa; text-align:center; padding:28px 0; font-size:18px; }
  @media (max-width:480px) {
    header { padding:22px 8px 18px; }
    header h1 { font-size:27px; }
    main { padding:0 18px 100px; }
    .progress { font-size:19px; margin:2px 0 24px; }
    .flashcard { min-height: min(48vh, 380px); border-radius:22px; }
    .actions { gap:8px; margin:26px 0 20px; }
    button { padding:13px 14px; font-size:16px; border-radius:12px; }
    .toolbar { margin:14px 0; }
    .small-btn { font-size:13px; padding:10px 9px; }
    .toolbar { gap:7px; }
    .extra-toolbar .small-btn { font-size:14px; padding:10px 14px; }
    .panel { margin-top:24px; padding:24px 18px 28px; border-width:2px; }
    .panel h2 { margin-bottom:22px; }
    .stat { padding:17px; margin:12px 0; }
    .stat .count { font-size:32px; }
    .subtext { font-size:16px; margin-top:26px; }
    nav { padding:10px 8px 8px; }
    .nav-item { font-size:16px; padding:6px; }
    .nav-item .emoji { font-size:27px; }
  }

/* Perbaikan: hilangkan sorotan biru saat kartu diketuk/dibalik */
* { -webkit-tap-highlight-color: transparent !important; }
.flashcard, .flashcard * , .card, .card-front, .card-back {
  -webkit-tap-highlight-color: transparent !important;
  outline-color: transparent;
}

</style>
</head>

<header><h1>📚 Flashcard Belajar</h1></header>
<div class="header-actions"><button class="small-btn" id="topShuffleBtn">🔀 Acak</button><button class="small-btn" id="topResetBtn">↻ Ulangi</button></div>
<main>
  <section id="learnView">
    <div class="progress" id="progress">1 / 5</div>
    <div class="flashcard" id="flashcard" role="button" tabindex="0" aria-label="Ketuk untuk membalik kartu">
      <div class="card-inner">
        <div class="card-face card-front"><div class="word" id="word">今日</div></div>
        <div class="card-face card-back">

          <div class="meaning" id="meaning">Hari ini</div>
        </div>

    </div>
    <div class="actions">
      <button class="red" data-status="unlearned">❌ Belum Hafal</button>
      <button class="yellow" data-status="unsure">⚠️ Ragu-ragu</button>
      <button class="green" data-status="learned">✅ Sudah Hafal</button>
    </div>
    <p id="statusFeedback" class="subtext" aria-live="polite" style="margin:12px 0; min-height:24px;"></p>
    <div class="toolbar">
      <button class="small-btn" id="prevBtn">← Sebelumnya</button>
      <button class="small-btn" id="nextBtn">Berikutnya →</button>
    </div>
  </section>

  <section id="summaryView" class="hidden">
    <div class="panel">
      <h2>📊 Ringkasan Hafalan</h2>
      <div class="stat green-bg" role="button" tabindex="0" data-filter="learned">
        <div class="label">✅ Sudah Hafal</div><div class="count" id="learnedCount">0</div>
      </div>
      <div class="stat yellow-bg" role="button" tabindex="0" data-filter="unsure">
        <div class="label">⚠️ Ragu-ragu</div><div class="count" id="unsureCount">0</div>
      </div>
      <div class="stat red-bg" role="button" tabindex="0" data-filter="unlearned">
        <div class="label">❌ Belum Hafal</div><div class="count" id="unlearnedCount">0</div>
      </div>
      <p class="subtext">Klik kategori di atas untuk mulai mengulang</p>
    </div>
  </section>
</main>
<nav>

</nav>

  ];
  const statusLabels = { learned:"Sudah Hafal", unsure:"Ragu-ragu", unlearned:"Belum Hafal" };
  const status = {};
  let current = 0;
  let showingMeaning = false;
  let activeFilter = null;
  let filteredCards = [...cards];

  const $ = id => document.getElementById(id);
  function renderCard() {
    const card = filteredCards[current];
    if (!card) {
      $("word").textContent = "Tidak ada kartu";
      $("reading").textContent = "";
      $("meaning").textContent = "";
      $("flashcard").classList.remove("flipped");
      $("progress").textContent = "0 / 0";
      return;
    }
    $("word").textContent = card.word;
    $("reading").textContent = card.reading;
    $("meaning").textContent = card.meaning;
    $("flashcard").classList.toggle("flipped", showingMeaning);
    $("progress").textContent = `${current + 1} / ${filteredCards.length}`;
  }
  function flipCard() { showingMeaning = !showingMeaning; renderCard(); }
  function goTo(index) {
    if (!filteredCards.length) return;
    current = (index + filteredCards.length) % filteredCards.length;
    if ($("statusFeedback")) $("statusFeedback").textContent = "";
    showingMeaning = false;
    renderCard();
  }
  function updateSummary() {
    $("learnedCount").textContent = cards.filter(c => status[c.word] === "learned").length;
    $("unsureCount").textContent = cards.filter(c => status[c.word] === "unsure").length;
    $("unlearnedCount").textContent = cards.filter(c => status[c.word] === "unlearned" || !status[c.word]).length;
  }
  function setView(view) {
    const isLearn = view === "learn";
    $("learnView").classList.toggle("hidden", !isLearn);
    $("summaryView").classList.toggle("hidden", isLearn);
    $("learnTab").classList.toggle("active", isLearn);
    $("summaryTab").classList.toggle("active", !isLearn);
    if (!isLearn) updateSummary();
  }
  function markCard(value) {
    const card = filteredCards[current];
    if (!card) return;
    status[card.word] = value;
    updateSummary();
    const feedback = $("statusFeedback");
    feedback.textContent = `Tersimpan: ${statusLabels[value]} — ${card.word}`;
    // Pindah ke kartu berikutnya setelah status benar-benar dicatat.
    if (current < filteredCards.length - 1) {
      goTo(current + 1);
    } else {
      showingMeaning = false;
      renderCard();
      feedback.textContent = `Tersimpan: ${statusLabels[value]} — ${card.word}. Semua kartu dalam daftar ini sudah dinilai.`;
    }
  }
  document.querySelectorAll("button[data-status]").forEach(button => {
    button.type = "button";
    button.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      markCard(button.dataset.status);
    });
  });
  $("flashcard").addEventListener("click", () => {
    if (didSwipe) { didSwipe = false; return; }
    flipCard();
  });
  $("flashcard").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flipCard(); } });

  // Geser ke kiri = kartu sebelumnya, geser ke kanan = kartu berikutnya.
  let touchStartX = 0;
  let touchStartY = 0;
  let didSwipe = false;
  const flashcardEl = $("flashcard");
  flashcardEl.addEventListener("touchstart", e => {
    if (!e.changedTouches.length) return;
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
    didSwipe = false;
  }, { passive: true });
  flashcardEl.addEventListener("touchend", e => {
    if (!e.changedTouches.length) return;
    const deltaX = e.changedTouches[0].clientX - touchStartX;
    const deltaY = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(deltaX) < 45 || Math.abs(deltaX) < Math.abs(deltaY) * 1.2) return;
    didSwipe = true;
    if (deltaX > 0) goTo(current + 1);
    else goTo(current - 1);
  }, { passive: true });
  $("prevBtn").addEventListener("click", () => goTo(current - 1));
  $("nextBtn").addEventListener("click", () => goTo(current + 1));

  // Acak urutan kartu yang sedang ditampilkan.
  function shuffleCards() {
    for (let i = filteredCards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
    }
    current = 0; showingMeaning = false; renderCard();
  }
  $("topShuffleBtn").addEventListener("click", shuffleCards);

  // Reset status hafalan untuk memulai dari awal.
  function resetAll() {
    // Mulai ulang langsung tanpa dialog browser yang kadang tidak tampil dengan baik di HP.
    Object.keys(status).forEach(key => delete status[key]);
    filteredCards = [...cards];
    activeFilter = null;
    current = 0;
    showingMeaning = false;
    goTo(0);
    updateSummary();
  }
  $("topResetBtn").addEventListener("click", resetAll);
  $("learnTab").addEventListener("click", () => { activeFilter = null; filteredCards = [...cards]; goTo(0); setView("learn"); });
  $("summaryTab").addEventListener("click", () => { updateSummary(); setView("summary"); });
  function startReview(filter) {
    activeFilter = filter;
    filteredCards = cards.filter(c => filter === "unlearned" ? (status[c.word] === "unlearned" || !status[c.word]) : status[c.word] === filter);
    current = 0; showingMeaning = false; renderCard(); setView("learn");
  }
  document.querySelectorAll("[data-filter]").forEach(item => {
    const activate = () => startReview(item.dataset.filter);
    item.addEventListener("click", activate);
    item.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); } });
  });
  updateSummary();
  renderCard();
